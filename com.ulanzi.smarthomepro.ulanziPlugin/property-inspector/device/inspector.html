<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Home PRO</title>
<link rel="stylesheet" href="../../libs/css/uspi.css"></head>
<body><div class="uspi-wrapper">
  <h3>Smart Home PRO</h3>
  <p id="status" role="status">Connect Home Assistant via HA_URL and HA_TOKEN in the service environment.</p>
  <form id="property-inspector">
    <div class="uspi-item"><label class="uspi-item-label" for="entityId">Device</label>
      <select class="uspi-item-value" id="entityId" name="entityId"><option value="">Select a device</option></select>
    </div>
    <div class="uspi-item"><label class="uspi-item-label" for="service">Action</label>
      <select class="uspi-item-value" id="service" name="service">
       <option value="toggle">Toggle</option><option value="turn_on">Turn on</option><option value="turn_off">Turn off</option>
       <option value="open_cover">Open cover</option><option value="close_cover">Close cover</option><option value="stop_cover">Stop cover</option>
      </select></div>
  </form>
  <button type="button" id="refresh">Refresh devices</button>
  <p>Supported in this MVP: lights, switches, fans, covers, scenes, scripts and input booleans. Lock and alarm control is intentionally excluded.</p>
</div>
<script src="../../libs/js/constants.js"></script>
<script src="../../libs/js/eventEmitter.js"></script>
<script src="../../libs/js/timers.js"></script>
<script src="../../libs/js/utils.js"></script>
<script src="../../libs/js/ulanziApi.js"></script>
<script src="./inspector.js"></script>
</body></html>
